<section class="page-hero">
  {%- if include.image -%}
  <img src="{{ include.image | relative_url }}" alt="" aria-hidden="true" width="1600" height="700">
  {%- endif -%}
  <div class="page-hero-overlay" aria-hidden="true"></div>
  <div class="wrap page-hero-text">
    {%- if include.kicker -%}<p class="section-label light">{{ include.kicker }}</p>{%- endif -%}
    <h1>{{ include.title }}</h1>
    {%- if include.subtitle -%}<p class="page-hero-sub">{{ include.subtitle }}</p>{%- endif -%}
  </div>
</section>
